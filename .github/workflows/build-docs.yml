# Build and publish only on push to master when Writerside version changes.

name: Build documentation

on:
  push:
    branches: [master]
    paths:
      - 'Writerside/**'
      - '.github/workflows/build-docs.yml'

permissions:
  contents: read
  id-token: write
  pages: write

env:
  INSTANCE: 'Writerside/iedi-adm'
  DOCKER_VERSION: '243.22562'
  WRITERSIDE_CFG: 'Writerside/writerside.cfg'

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare guide version
        id: check
        run: |
          CURRENT=$(grep -oP 'version="\K[^"]+' "$WRITERSIDE_CFG" | head -1)
          PREVIOUS=$(git show HEAD^:"$WRITERSIDE_CFG" 2>/dev/null | grep -oP 'version="\K[^"]+' | head -1 || true)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ -z "$PREVIOUS" ] || [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing: version \`$CURRENT\` (was \`${PREVIOUS:-<none>}\`)."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: version still \`$CURRENT\`. Bump \`version\` in \`$WRITERSIDE_CFG\` on \`master\` to publish."
          fi
          echo "### Version gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Current: \`$CURRENT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous on master: \`${PREVIOUS:-<none>}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish: \`${{ steps.check.outputs.publish }}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version-check
    if: needs.version-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.define-ids.outputs.artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define instance id and artifacts
        id: define-ids
        run: |
          INSTANCE=${INSTANCE#*/}
          INSTANCE_ID_UPPER=$(echo "$INSTANCE" | tr '[:lower:]' '[:upper:]')
          ARTIFACT="webHelp${INSTANCE_ID_UPPER}2-all.zip"
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Build docs using Writerside Docker builder
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ env.INSTANCE }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ needs.version-check.outputs.version }}
          path: |
            artifacts/${{ steps.define-ids.outputs.artifact }}
            artifacts/report.json
          retention-days: 30

  deploy:
    needs: [version-check, build]
    if: needs.version-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-${{ needs.version-check.outputs.version }}
          path: artifacts

      - name: Unzip artifact
        run: unzip -O UTF-8 -qq "artifacts/${{ needs.build.outputs.artifact }}" -d dir

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Package and upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dir

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Published site summary
        run: |
          {
            echo "### GitHub Pages updated"
            echo "- **URL:** ${{ steps.deployment.outputs.page_url }}"
            echo "- **Guide version:** \`${{ needs.version-check.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
